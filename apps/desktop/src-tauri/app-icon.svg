<!--
  owntools app icon, "sky" (2026-09-13): the landing's sky with the sail on
  the horizon. Full bleed, rx 230 = the ToolMark / BrandMark frame.
  Do not run `tauri icon` on this file by hand: `node scripts/app-icon.mjs`
  regenerates icons/ and swaps in app-icon-16/24/32.svg for the small .ico
  frames, plus the macOS grid for icon.icns.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <clipPath id="tile"><rect width="1024" height="1024" rx="230"/></clipPath>
    <filter id="ring" x="-300" y="-300" width="1624" height="1624" filterUnits="userSpaceOnUse"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="rim" x="-300" y="-300" width="1624" height="1624" filterUnits="userSpaceOnUse"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="0.55"/></filter>
    <filter id="haze" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="724" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2f7fce"/><stop offset=".62" stop-color="#62aae7"/><stop offset="1" stop-color="#d6ebf3"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="724" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5aa7e6"/><stop offset=".35" stop-color="#3a86d4"/><stop offset="1" stop-color="#1c5aa3"/>
    </linearGradient>
    <radialGradient id="sun" cx="790" cy="190" r="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".22" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <!-- sail + hull on the 12-unit BrandMark grid, placed at (512, 520), 40 px per unit -->
    <linearGradient id="sail" x1="3" y1="0.8" x2="9" y2="11.2" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e3ebff"/>
    </linearGradient>
    <!-- the dotted desk, faded out before the horizon -->
    <pattern id="dots" width="64" height="64" patternUnits="userSpaceOnUse">
      <circle cx="32" cy="32" r="4.2" fill="#fff" fill-opacity=".16"/>
    </pattern>
    <linearGradient id="dotsFade" x1="0" y1="0" x2="0" y2="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="dotsMask"><rect width="1024" height="724" fill="url(#dotsFade)"/></mask>
    <linearGradient id="reflFade" x1="0" y1="728" x2="0" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="reflMask"><rect y="724" width="1024" height="300" fill="url(#reflFade)"/></mask>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="url(#sky)"/>
    <g mask="url(#dotsMask)"><rect width="1024" height="724" fill="url(#dots)"/></g>
    <rect width="1024" height="1024" fill="url(#sun)"/>
    <rect y="724" width="1024" height="300" fill="url(#sea)"/>
    <rect y="706" width="1024" height="40" fill="#fff" opacity=".5" filter="url(#haze)"/>

    <!-- reflection: the boat mirrored in the water, fading with depth -->
    <g mask="url(#reflMask)">
      <g transform="translate(0 1464) scale(1 -1)">
        <g transform="translate(272 280) scale(40)">
          <path d="M6 0.8L10.4 7.6H1.6L6 0.8Z" fill="#fff" stroke="#fff" stroke-width=".42" stroke-linejoin="round"/>
          <path d="M2 9H10L8.6 11.2H3.4L2 9Z" fill="#fff" stroke="#fff" stroke-width=".42" stroke-linejoin="round"/>
        </g>
      </g>
    </g>
    <rect x="200" y="800" width="624" height="5" rx="2.5" fill="#fff" opacity=".12"/>
    <rect x="290" y="846" width="444" height="5" rx="2.5" fill="#fff" opacity=".07"/>

    <!-- the boat: soft shadow, the sail itself, a light catching its left edge -->
    <g transform="translate(272 280) scale(40)">
      <g opacity=".22" filter="url(#soft)" transform="translate(0 .3)">
        <path d="M6 0.8L10.4 7.6H1.6L6 0.8Z" fill="#123a78" stroke="#123a78" stroke-width=".42" stroke-linejoin="round"/>
        <path d="M2 9H10L8.6 11.2H3.4L2 9Z" fill="#123a78" stroke="#123a78" stroke-width=".42" stroke-linejoin="round"/>
      </g>
      <path d="M6 0.8L10.4 7.6H1.6L6 0.8Z" fill="url(#sail)" stroke="url(#sail)" stroke-width=".42" stroke-linejoin="round"/>
      <path d="M2 9H10L8.6 11.2H3.4L2 9Z" fill="url(#sail)" stroke="url(#sail)" stroke-width=".42" stroke-linejoin="round"/>
      <path d="M6 0.8L1.6 7.6" stroke="#fff" stroke-opacity=".55" stroke-width=".16" stroke-linecap="round" transform="translate(.12 .1)"/>
    </g>

    <!-- the tile as an object: shade inside the edge, a rim of light along the top -->
    <rect x="0" y="-22" width="1024" height="1024" rx="230" fill="none" stroke="#0b2a55" stroke-width="110" opacity=".18" filter="url(#ring)"/>
    <rect x="0" y="7" width="1024" height="1024" rx="230" fill="none" stroke="#fff" stroke-width="10" opacity=".4" filter="url(#rim)"/>
  </g>
</svg>
