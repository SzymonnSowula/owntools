<!-- app-icon.svg drawn for 32 px: the first icon.ico frame, so also the window and tray icon (default_window_icon). Integer edges, no blur. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <clipPath id="t"><rect width="32" height="32" rx="7.2"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2c7bcb"/><stop offset=".65" stop-color="#5aa4e4"/><stop offset="1" stop-color="#bfdff0"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="22" x2="0" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4894dc"/><stop offset="1" stop-color="#1b56a0"/>
    </linearGradient>
    <radialGradient id="sun" cx="24.96" cy="5.76" r="10.88" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g clip-path="url(#t)">
    <rect width="32" height="32" fill="url(#sky)"/>
    <rect width="32" height="22" fill="url(#sun)"/>
    <rect y="22" width="32" height="10" fill="url(#sea)"/>
    <path d="M16 7L21.5 16H10.5Z" fill="#fff"/>
    <path d="M11 18H21L19.5 21H12.5Z" fill="#fff"/>
    <rect x=".5" y=".5" width="31" height="31" rx="6.7" fill="none" stroke="#0b2a55" stroke-opacity=".18"/>
  </g>
</svg>
