[package]
name = "owntools"
version = "0.3.2"
description = "Local-first desktop studio - your voice, your screen, your files, all on your device"
authors = ["owntools"]
edition = "2021"

[lib]
name = "owntools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api`: the dictation pill is a transparent, undecorated,
# non-activating window, and on macOS a transparent webview is private API
# (which also rules out the Mac App Store; we ship a notarized .dmg). The
# feature has to be named here, next to `app.macOSPrivateApi` in
# tauri.conf.json: tauri-build compares this line with the config and never
# reads a `[target.'cfg(target_os = "macos")']` table, so declaring it there
# stopped every macOS build before our code compiled. On Windows it adds
# nothing - wry only reads it on macOS.
tauri = { version = "2", features = ["tray-icon", "protocol-asset", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# `unsafe-headers`: lets the frontend send `Origin: ""`, which the plugin then
# drops instead of stamping the webview origin on the request — YouTube's
# InnerTube endpoint answers 403 to any request carrying a foreign Origin.
tauri-plugin-http = { version = "2.6.0", features = ["unsafe-headers"] }
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-log = "2"
tauri-plugin-process = "2"
tauri-plugin-window-state = "2"
log = "0.4"
reqwest = { version = "0.12", features = ["stream"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "sync"] }
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
# parakeet: unpacking the sherpa-onnx runtime archive (.tar.bz2); the bzip2
# backend is the pure-Rust one, so no C toolchain surprises on CI.
tar = "0.4"
bzip2 = "0.6"
# llm: unpacking the llama.cpp release zip on Windows (macOS ships a .tar.gz,
# read with tar + flate2 above). Same `zip` major the tree already carries.
zip = { version = "4", default-features = false, features = ["deflate"] }
# data-folder migration (identifier rename) runs before Tauri resolves paths.
dirs = "6"
# disk: snapshots are gzip JSON.
flate2 = "1"
# social: the local agent server (REST + MCP + OAuth loopback)
axum = { version = "0.8", features = ["multipart"] }
tower-http = { version = "0.6", features = ["cors"] }
rand = "0.9"
base64 = "0.22"
# capture: the screenshot itself (xcap), PNG encode/decode for the library
# copy and the clipboard (image, png only), the system clipboard (arboard —
# no plugin, no npm package: the overlay never needs a JS clipboard API).
xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }
arboard = { version = "3.6", default-features = false, features = ["image-data"] }
# sync: watches the person's own synced folder (Dropbox, OneDrive, …) for the
# other device's writes; debounced in sync.rs, never on the main thread.
notify = "8"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Threading",
  "Win32_System_SystemInformation",
  "Win32_System_LibraryLoader",
  "Win32_Storage_FileSystem",
  "Win32_UI_Shell",
  "Win32_System_Com",
  # meet: WASAPI capture (mic + loopback) and endpoint names via the property store
  "Win32_Media_Audio",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_Devices_FunctionDiscovery",
  # capture: text recognition through WinRT Windows.Media.Ocr
  "Media_Ocr",
  "Graphics_Imaging",
  "Storage",
  "Storage_Streams",
  "Foundation",
  "Foundation_Collections",
  # child_job.rs: the model servers die with owntools, however it exits
  "Win32_System_JobObjects",
  "Win32_Security",
] }
# disk: `#[implement]` for the Recycle Bin move's progress sink expands to
# `::windows_core` paths, so the crate has to be named here — same version as `windows`.
windows-core = "0.61"
# disk: installed apps come from the registry's Uninstall keys.
winreg = "0.55"
# Same major as wry's, so the COM types line up with tauri's `PlatformWebview`.
webview2-com = "0.38"
uiautomation = "0.24"
