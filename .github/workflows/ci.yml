name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-and-packages:
    name: typecheck + tests + next build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No version here on purpose: it reads `packageManager` from package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm --filter web build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  rust:
    name: cargo check + test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Both platforms always run: the point of the macOS leg is to catch the
      # `#[cfg(target_os = "macos")]` arms, which nothing on a Windows machine
      # ever compiles.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-14
            name: macos
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.name }}

      # tauri-build looks for the frontend output folder; an empty one is enough
      # for a type check, and it saves running the whole web build here.
      - name: Placeholder frontend output
        run: mkdir -p apps/desktop/dist
        shell: bash

      - run: cargo check --all-targets
        working-directory: apps/desktop/src-tauri

      - run: cargo test
        working-directory: apps/desktop/src-tauri
