name: Release

# Pushing a `v*` tag (or running this by hand) builds the installers, signs the
# updater artifacts with the Tauri key, and uploads them to a DRAFT GitHub
# release named after the version in apps/desktop/src-tauri/tauri.conf.json.
#
#   windows → NSIS `…_x64-setup.exe` + `.sig`
#   macos   → universal `.dmg` and `.app.tar.gz` + `.sig`
#
# The macOS job runs after the Windows one on purpose: `latest.json` is a single
# release asset that tauri-action merges platform by platform, and two jobs
# writing it at once would lose one of them.
#
# Runbook: docs/release.md. macOS specifics: docs/macos.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: windows installer (nsis)
    runs-on: windows-latest
    env:
      # `if: secrets.X` is not allowed, so the secret's presence goes through an env var.
      HAS_CERT: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile

      # Optional Windows code signing: WINDOWS_CERTIFICATE is a base64-encoded PFX.
      # Without it the installer is built unsigned (SmartScreen will warn).
      - name: Import code-signing certificate
        if: env.HAS_CERT == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $params = @{ FilePath = $pfx; CertStoreLocation = "Cert:\CurrentUser\My" }
          if ($env:WINDOWS_CERTIFICATE_PASSWORD) {
            $params.Password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          }
          $cert = Import-PfxCertificate @params
          Remove-Item $pfx -Force
          "WINDOWS_CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Imported $($cert.Subject) (thumbprint $($cert.Thumbprint))"

      - name: Build installer + draft release (signed)
        if: env.HAS_CERT == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          tagName: v__VERSION__
          releaseName: "owntools v__VERSION__"
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: --config '{"bundle":{"windows":{"certificateThumbprint":"${{ env.WINDOWS_CERT_THUMBPRINT }}","digestAlgorithm":"sha256","timestampUrl":"http://timestamp.digicert.com"}}}'

      - name: Build installer + draft release (unsigned)
        if: env.HAS_CERT != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          tagName: v__VERSION__
          releaseName: "owntools v__VERSION__"
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true

  macos:
    name: macos universal (dmg + app)
    runs-on: macos-14
    needs: windows
    env:
      # An Apple Developer ID certificate is what turns "macOS says this app is
      # damaged" into a normal double-click. Without it the build still runs and
      # produces an unsigned .dmg — see docs/macos.md for what users then face.
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # A universal binary is two real builds stitched together, so both
          # targets have to be installed even though the runner is arm64.
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: macos-universal

      - run: pnpm install --frozen-lockfile

      - name: Build universal app + attach to the draft release (signed & notarized)
        if: env.HAS_APPLE_CERT == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Code signing: a base64 .p12 plus its password, and the identity to
          # sign with ("Developer ID Application: Name (TEAMID)").
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Notarization: an app-specific password, not the Apple ID password.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          tagName: v__VERSION__
          releaseName: "owntools v__VERSION__"
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: --target universal-apple-darwin

      - name: Build universal app + attach to the draft release (unsigned)
        if: env.HAS_APPLE_CERT != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          tagName: v__VERSION__
          releaseName: "owntools v__VERSION__"
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: --target universal-apple-darwin
